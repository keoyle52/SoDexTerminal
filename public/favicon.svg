<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background & Aura Gradients -->
    <radialGradient id="auraGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00F2FE" stop-opacity="0.25" />
      <stop offset="60%" stop-color="#7928CA" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#05070B" stop-opacity="0" />
    </radialGradient>

    <!-- Metallic Shield Gradient -->
    <linearGradient id="shieldBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F2FE" />
      <stop offset="50%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#8B5CF6" />
    </linearGradient>

    <!-- Core Dynamic S Ribbon Gradient -->
    <linearGradient id="coreRibbon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F2FE" />
      <stop offset="40%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#6366F1" />
    </linearGradient>
    
    <linearGradient id="coreAccent" x1="100%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#8B5CF6" />
      <stop offset="100%" stop-color="#00D4FF" />
    </linearGradient>

    <!-- Drop Shadow Filter for institutional depth -->
    <filter id="glowFilter" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Deep Obsidian Background Base -->
  <rect width="512" height="512" rx="128" fill="#07090E" />
  
  <!-- Outer Ambient Aura -->
  <circle cx="256" cy="256" r="240" fill="url(#auraGlow)" />

  <!-- Outer Institutional Shield (Geometric Polygon) -->
  <polygon points="256,42 436,120 436,320 256,458 76,320 76,120" 
           fill="#0F131D" 
           stroke="url(#shieldBorder)" 
           stroke-width="14" 
           stroke-linejoin="round" 
           filter="url(#glowFilter)" />

  <!-- Inner Cyber Hex Grid Accents -->
  <polygon points="256,70 410,136 410,310 256,430 102,310 102,136" 
           fill="#121624" 
           stroke="rgba(255, 255, 255, 0.06)" 
           stroke-width="4" 
           stroke-linejoin="round" />

  <!-- Central Interlocking Power Ribbon 'S' (Symbolizing Liquidity, AI & Security) -->
  <!-- Top Curve of S -->
  <path d="M 330 175 C 330 145, 295 130, 256 130 C 205 130, 168 155, 168 195 C 168 255, 344 245, 344 315 C 344 360, 305 382, 256 382 C 195 382, 160 350, 160 320" 
        fill="none" 
        stroke="url(#coreRibbon)" 
        stroke-width="34" 
        stroke-linecap="round" 
        stroke-linejoin="round" />

  <!-- Interlocking Secondary Accent Flow for High-Tech Depth -->
  <path d="M 180 180 C 210 150, 250 145, 280 145" 
        fill="none" 
        stroke="url(#coreAccent)" 
        stroke-width="12" 
        stroke-linecap="round" />
        
  <path d="M 332 332 C 302 362, 262 367, 232 367" 
        fill="none" 
        stroke="url(#coreAccent)" 
        stroke-width="12" 
        stroke-linecap="round" />

  <!-- Center Quantum Node Dot -->
  <circle cx="256" cy="256" r="16" fill="#00F2FE" filter="url(#glowFilter)" />
</svg>